<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GeoLive 0804.1716</title>
<meta name="theme-color" content="#0e2730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GeoLive">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./style.css?v=1716">
</head>
<body>
<div id="app">
  <div id="map"></div>
  <button id="menuBtn" class="round top-left">☰</button>
  <div id="coords">等待 GPS…</div>
  <div id="networkBadge">網路檢查中</div>

  <aside id="drawer" class="panel hidden">
    <div class="panel-head"><b>GeoLive 0804.1716</b><button id="closeDrawer">×</button></div>
    <button id="importBtn" class="wide">匯入專案資料夾</button>
    <input id="folderInput" type="file" multiple accept=".gpx,image/*" hidden>
    <button id="offlineDownloadBtn" class="wide">下載離線地圖</button>
    <button id="offlineManageBtn" class="wide">管理離線地圖</button>
    <label class="offline-test"><input id="simulateOffline" type="checkbox"> 模擬離線（真實飛航模式）</label>
    <h3>現有專案</h3>
    <div id="projectList" class="scroll-list"></div>
  </aside>

  <div id="profileBox"><div class="profile-title">路徑地形剖面</div><canvas id="profileCanvas" width="280" height="95"></canvas></div>
  <button id="finishBtn" class="action finish hidden">Finish</button>
  <button id="mainBtn" class="action main">Start</button>
  <label id="cameraBtn" class="action camera hidden">📷<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden></label>
</div>

<div id="modal" class="modal hidden"><div class="modal-card">
  <div class="panel-head"><b id="modalTitle"></b><button id="modalClose">×</button></div>
  <div id="modalBody"></div>
</div></div>
<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/exifr/dist/full.umd.js"></script>
<script src="./app.js?v=1716"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=1716');
</script>

<section id="fieldTools" class="field-tools">
  <h2>野外測量工具</h2>
  <div class="tool-card">
    <h3>指北針</h3>
    <div class="compass-wrap">
      <div id="compassDial" class="compass-dial"><span class="north-mark">N</span><span class="needle">▲</span></div>
      <div><strong id="headingValue">--°</strong> <span id="headingCardinal">等待啟用</span></div>
    </div>
    <button id="startCompassBtn" type="button">啟用指北針</button>
  </div>
  <div class="tool-card">
    <h3>傾角測量</h3>
    <div class="dip-readout"><strong id="dipValue">--°</strong></div>
    <div id="dipDirection">請將手機貼近平面後啟用</div>
    <button id="startDipBtn" type="button">啟用傾角測量</button>
    <button id="zeroDipBtn" type="button">歸零</button>
  </div>
  <p id="sensorStatus" class="sensor-status">iPhone 第一次使用會要求允許「動作與方向」存取。</p>
</section>

</body></html>
